name: Build APK FloatAI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/floatai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FloatAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.floatai'
              compileSdk 34
              defaultConfig { applicationId "com.example.floatai"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          configurations.all {
              resolutionStrategy { force 'androidx.exifinterface:exifinterface:1.3.7' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.mlkit:text-recognition:16.0.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:label="FloatAI" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # Gambar ikon custom buat notifikasi
          cat << 'EOF' > app/src/main/res/drawable/ic_notification.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,17c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM13,13h-2V7h2v6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FloatAI - Asisten Belajar" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
              <Button android:id="@+id/btnStart" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aktifkan Jendela Mengambang"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="vertical" android:background="#CC000000" android:padding="8dp">
              <TextView android:id="@+id/tvBubble" android:layout_width="60dp" android:layout_height="60dp" android:text="AI" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="18sp" android:gravity="center" android:background="@android:drawable/btn_default"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_answer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="300dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="#EE1E1E1E" android:padding="12dp">
              <TextView android:id="@+id/tvAnswer" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="14sp" android:maxHeight="400dp" android:scrollbars="vertical"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/MainActivity.kt
          package com.example.floatai
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private val projectionManager by lazy { getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          startActivityForResult(projectionManager.createScreenCaptureIntent(), 1001)
                      }
                  }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      ScreenCaptureHelper.resultCode = resultCode
                      ScreenCaptureHelper.data = data
                      startForegroundService(Intent(this, FloatingService::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/ScreenCaptureHelper.kt
          package com.example.floatai
          import android.content.Intent
          object ScreenCaptureHelper { var resultCode: Int = 0; var data: Intent? = null }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/FloatingService.kt
          package com.example.floatai
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.*
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlinx.coroutines.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException

          class FloatingService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var bubbleView: View
              private var answerView: View? = null
              private val client = OkHttpClient()
              
              // ⚠️ MASUKKAN API KEY GEMINI ANDA DI SINI NANTI
              private val API_KEY = "MASUKKAN_API_KEY_ANDA_DISINI"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val channelId = "float_ai"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FloatAI", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  // Menggunakan ikon custom yang baru dibuat
                  val notif = NotificationCompat.Builder(this, channelId).setContentTitle("FloatAI aktif").setSmallIcon(R.drawable.ic_notification).build()
                  startForeground(1, notif)
                  showBubble()
              }

              private fun showBubble() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 100; params.y = 300
                  bubbleView.findViewById<TextView>(R.id.tvBubble).setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = params.x; initialY = params.y; touchX = event.rawX; touchY = event.rawY; return true }
                              MotionEvent.ACTION_MOVE -> { params.x = initialX + (event.rawX - touchX).toInt(); params.y = initialY + (event.rawY - touchY).toInt(); windowManager.updateViewLayout(bubbleView, params); return true }
                              MotionEvent.ACTION_UP -> { if (Math.abs(event.rawX - touchX) < 10 && Math.abs(event.rawY - touchY) < 10) captureAndSolve(); return true }
                          }
                          return false
                      }
                  })
                  windowManager.addView(bubbleView, params)
              }

              private fun captureAndSolve() {
                  val data = ScreenCaptureHelper.data ?: return
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection = mpManager.getMediaProjection(ScreenCaptureHelper.resultCode, data)
                  val metrics = resources.displayMetrics
                  val w = metrics.widthPixels; val h = metrics.heightPixels; val density = metrics.densityDpi
                  val imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 1)
                  val virtualDisplay = projection.createVirtualDisplay("cap", w, h, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.surface, null, null)
                  
                  GlobalScope.launch {
                      delay(500)
                      val image = imageReader.acquireLatestImage()
                      if (image != null) {
                          val planes = image.planes; val buffer = planes[0].buffer
                          val pixelStride = planes[0].pixelStride; val rowStride = planes[0].rowStride
                          val rowPadding = rowStride - pixelStride * w
                          val bitmap = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                          bitmap.copyPixelsFromBuffer(buffer); image.close()
                          val cropped = Bitmap.createBitmap(bitmap, 0, 0, w, h)
                          runOCR(cropped)
                      }
                      virtualDisplay.release(); projection.stop()
                  }
              }

              private fun runOCR(bitmap: Bitmap) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS).process(image)
                      .addOnSuccessListener { text -> if (text.text.isNotBlank()) askAI(text.text.trim()) else Toast.makeText(this, "Tidak ada teks", Toast.LENGTH_SHORT).show() }
                      .addOnFailureListener { Toast.makeText(this, "OCR Gagal", Toast.LENGTH_SHORT).show() }
              }

              private fun askAI(question: String) {
                  Toast.makeText(this, "AI Berpikir...", Toast.LENGTH_SHORT).show()
                  val url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$API_KEY"
                  val bodyJson = JSONObject().apply {
                      put("contents", JSONArray().apply { put(JSONObject().apply { put("parts", JSONArray().apply { put(JSONObject().put("text", "Jelaskan jawaban soal ini langkah demi langkah:\n\n$question")) }) }) })
                  }
                  val request = Request.Builder().url(url).post(RequestBody.create("application/json".toMediaType(), bodyJson.toString())).build()
                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) { showResult("Error: ${e.message}") }
                      override fun onResponse(call: Call, response: Response) {
                          val bodyStr = response.body?.string() ?: ""
                          val answer = try {
                              JSONObject(bodyStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          } catch (e: Exception) { "Gagal API: $bodyStr" }
                          showResult(answer)
                      }
                  })
              }

              private fun showResult(text: String) {
                  Handler(Looper.getMainLooper()).post {
                      if (answerView == null) {
                          answerView = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                          val params = WindowManager.LayoutParams(
                              WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                          )
                          params.gravity = Gravity.CENTER
                          answerView!!.findViewById<TextView>(R.id.tvAnswer).setOnClickListener {
                              windowManager.removeView(answerView); answerView = null
                          }
                          windowManager.addView(answerView, params)
                      }
                      answerView!!.findViewById<TextView>(R.id.tvAnswer).text = text
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
